<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Name that UN country!</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; --pane-h: 720px; }
    body { margin: 0; background: #f6f6f6; color: #111; }
    .wrap { padding: 18px 20px; }
    .title { font-size: 20px; margin: 0 0 10px; }
    .layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 18px;
      align-items: stretch;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }
    #map {
      height: var(--pane-h);
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #e9eef5;
    }
    .panel {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 14px;
      padding-bottom: 64px;
      height: var(--pane-h);
      position: relative;
    }
    .panel h3 { margin: 0 0 10px; font-size: 16px; }
.panelHeader {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .scoreInline {
      font-size: 13px;
      color: #333;
      white-space: nowrap;
      width: 16ch;
      text-align: right;
      margin-right: 6px;
      flex: 0 0 16ch;
    }
    .quitFixed {
      position: absolute;
      left: 14px;
      bottom: 14px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #888;
      background: #f7f7f7;
      cursor: pointer;
    }

    .answers { list-style: none; padding: 0; margin: 0; }
    .answers li { margin: 6px 0; }
    .ansBtn {
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
    }
    .ansBtn:hover { background: #f3f3f3; }
    .bullet { width: 16px; text-align: center; color: #111; }
    .label { flex: 1; }
    .mark { width: 18px; text-align: center; font-weight: 700; }

    .correct { background: #c8f3c8; border-color: #7bd47b; }
    .wrong { background: #f6c1c1; border-color: #e18a8a; }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: flex-start;
      margin-top: 12px;
    }
    .controls button {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #888;
      background: #f7f7f7;
      cursor: pointer;
    }
    .controls button:disabled { opacity: 0.55; cursor: not-allowed; }

    .status {
      margin-top: 10px;
      min-height: 18px;
      color: #333;
      font-size: 13px;
      white-space: pre-wrap;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .overlay.show { display: flex; }
    .modal {
      background: #fff;
      border-radius: 10px;
      padding: 18px;
      max-width: 520px;
      width: 100%;
      border: 1px solid #ddd;
    }
    .modal h2 { margin: 0 0 8px; font-size: 18px; }
    .modal p { margin: 0 0 14px; color: #333; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="title">Name that UN country! Please, open the tab in full screen mode.</p>

    <div class="layout">
      <div id="map"></div>

      <div class="panel">
        <div class="panelHeader">
          <h3>Select your answer:</h3>
          <div class="scoreInline" id="status">Score:</div>
        </div>

        <ul class="answers" id="answers"></ul>

        <div class="controls">
          <button id="nextBtn" disabled>Next question</button>
        </div>

        <div class="status" id="message"></div>

        <button id="quitBtn" class="quitFixed">Quit game</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2>Game ended</h2>
      <p id="finalText">Thanks for playing.</p>
      <div class="controls" style="justify-content: flex-start">
        <button id="restartBtn">Restart</button>
      </div>
    </div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    const ORANGE_STYLE = {
      color: "#d08a00",
      weight: 3,
      fill: true,
      fillColor: "#f2a400",
      fillOpacity: 1.0
    }

    // UN members only. We display short names.
    const UN_MEMBERS_URL = "https://restcountries.com/v3.1/all?fields=name,cca2,cca3,unMember"

    const map = L.map("map", { zoomControl: true }).setView([20, 0], 2)

    // No-label basemap so players cannot read the answer under the overlay.
    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
    }).addTo(map)

    const answersEl = document.getElementById("answers")
    const nextBtn = document.getElementById("nextBtn")
    const quitBtn = document.getElementById("quitBtn")
    const statusEl = document.getElementById("status")
    const messageEl = document.getElementById("message")
    const overlay = document.getElementById("overlay")
    const restartBtn = document.getElementById("restartBtn")

    let countries = [] // { key, displayName, feature }
    let deck = []      // shuffled copy of countries, used as the question order
    let deckIndex = 0
    let gameComplete = false

    let current = null
    let currentLayer = null
    let locked = false
    let rounds = 0
    let correctCount = 0

    function pick(obj, keys) {
      for (const k of keys) {
        if (obj && obj[k] != null && String(obj[k]).trim() !== "") return obj[k]
      }
      return null
    }

    function normNameKey(s) {
      return String(s || "")
        .toLowerCase()
        .replace(/&/g, "and")
        .replace(/[^a-z0-9 ]+/g, " ")
        .replace(/\s+/g, " ")
        .trim()
    }

    const NAME_ALIAS_TO_CANON = new Map([
      ["united states of america", "united states"],
      ["russian federation", "russia"],
      ["iran islamic republic of", "iran"],
      ["venezuela bolivarian republic of", "venezuela"],
      ["bolivia plurinational state of", "bolivia"],
      ["tanzania united republic of", "tanzania"],
      ["lao people s democratic republic", "laos"],
      ["viet nam", "vietnam"],
      ["syrian arab republic", "syria"],
      ["moldova republic of", "moldova"],
      ["korea republic of", "south korea"],
      ["korea democratic people s republic of", "north korea"],
      ["czech republic", "czechia"],
      ["cote d ivoire", "cote divoire"],
      ["congo", "republic of the congo"],
      ["congo democratic republic of the", "democratic republic of the congo"],
      ["myanmar burma", "myanmar"],
      ["brunei darussalam", "brunei"],
      ["timor leste", "east timor"],
      ["macedonia", "north macedonia"],
      ["swaziland", "eswatini"],
      ["cape verde", "cabo verde"]
    ])

    function canon(name) {
      const n = normNameKey(name)
      return NAME_ALIAS_TO_CANON.get(n) || n
    }

    function getISO2(props) {
      return pick(props, ["ISO_A2", "iso_a2", "iso2", "ISO2", "alpha2", "alpha-2", "cca2", "id"])
    }

    function getISO3(props) {
      return pick(props, ["ISO_A3", "iso_a3", "ADM0_A3", "adm0_a3", "iso3", "ISO3", "alpha3", "alpha-3", "cca3"])
    }

    function geoName(props) {
      if (!props) return null
      return pick(props, [
        "ADMIN", "admin",
        "NAME", "name",
        "NAME_EN", "name_en",
        "SOVEREIGNT", "sovereignt",
        "COUNTRY", "country",
        "Country"
      ])
    }

    function shuffle(arr) {
      const a = arr.slice()
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1))
        const t = a[i]
        a[i] = a[j]
        a[j] = t
      }
      return a
    }

    function pickNOther(n, excludeKey) {
      const pool = countries.filter(c => c.key !== excludeKey)
      return shuffle(pool).slice(0, n)
    }

    function clearMapLayer() {
      if (currentLayer) {
        map.removeLayer(currentLayer)
        currentLayer = null
      }
    }

    function setCountryOnMap(feature) {
      clearMapLayer()

      currentLayer = L.geoJSON(feature, { style: ORANGE_STYLE }).addTo(map)
      currentLayer.bringToFront()

      const b = currentLayer.getBounds()
      if (!b || !b.isValid()) return

      const size = map.getSize()
      const padY = Math.round(size.y * 0.25)
      const padX = Math.round(size.x * 0.10)

      map.fitBounds(b, {
        paddingTopLeft: [padX, padY],
        paddingBottomRight: [padX, padY],
        maxZoom: 13
      })
    }

    function updateScoreDisplay(finalMode) {
      if (finalMode) {
        statusEl.textContent = "Final score: " + correctCount + "/" + rounds
        return
      }
      if (rounds <= 0) {
        statusEl.textContent = "Score:"
      if (messageEl) messageEl.textContent = ""
        return
      }
      statusEl.textContent = "Score: " + correctCount + "/" + rounds
    }

    function resetUIForNewQuestion() {
      answersEl.innerHTML = ""
      if (messageEl) messageEl.textContent = ""
      nextBtn.disabled = true
      locked = false
    }

    function renderAnswers(options) {
      answersEl.innerHTML = ""

      for (const opt of options) {
        const li = document.createElement("li")
        const btn = document.createElement("button")
        btn.className = "ansBtn"

        const bullet = document.createElement("span")
        bullet.className = "bullet"
        bullet.textContent = "•"

        const label = document.createElement("span")
        label.className = "label"
        label.textContent = opt.displayName

        const mark = document.createElement("span")
        mark.className = "mark"
        mark.textContent = ""

        btn.appendChild(bullet)
        btn.appendChild(label)
        btn.appendChild(mark)

        btn.addEventListener("click", () => onGuess(opt.key, btn))

        li.appendChild(btn)
        answersEl.appendChild(li)
      }
    }

    function lockAnswers() {
      const allButtons = Array.from(document.querySelectorAll(".ansBtn"))
      for (const b of allButtons) b.disabled = true
      return allButtons
    }

    function onGuess(chosenKey, chosenBtn) {
      if (locked) return
      locked = true
      nextBtn.disabled = false

      rounds += 1

      const correctKey = current.key
      const correctDisplay = current.displayName
      const allButtons = lockAnswers()

      if (chosenKey === correctKey) {
        correctCount += 1
        chosenBtn.classList.add("correct")
        chosenBtn.querySelector(".mark").textContent = "✓"
      } else {
        chosenBtn.classList.add("wrong")
        chosenBtn.querySelector(".mark").textContent = "✕"

        const correctBtn = allButtons.find(b => b.querySelector(".label").textContent === correctDisplay)
        if (correctBtn) {
          correctBtn.classList.add("correct")
          correctBtn.querySelector(".mark").textContent = "✓"
        }
      }

      const done = rounds >= deck.length
      if (done) {
        gameComplete = true
        nextBtn.textContent = "Start new game"
        updateScoreDisplay(true)
      } else {
        nextBtn.textContent = "Next question"
        updateScoreDisplay(false)
      }
    }

    function nextQuestion() {
      if (gameComplete) return

      resetUIForNewQuestion()

      if (deckIndex >= deck.length) {
        gameComplete = true
        nextBtn.textContent = "Start new game"
        nextBtn.disabled = false
        updateScoreDisplay(true)
        return
      }

      const pickOne = deck[deckIndex]
      deckIndex += 1
      current = pickOne

      setCountryOnMap(pickOne.feature)

      const others = pickNOther(9, pickOne.key)
      const options = shuffle([pickOne, ...others])

      renderAnswers(options)
    }

    function startNewGame() {
      overlay.classList.remove("show")

      rounds = 0
      correctCount = 0
      gameComplete = false

      deck = shuffle(countries)
      deckIndex = 0

      nextBtn.textContent = "Next question"
      updateScoreDisplay(false)
      if (messageEl) messageEl.textContent = ""

      nextQuestion()
    }

    function quitGame() {
      overlay.classList.add("show")
      document.getElementById("finalText").textContent =
        "Final score: " + correctCount + "/" + rounds + "."
    }

    nextBtn.addEventListener("click", () => {
      if (gameComplete) {
        startNewGame()
        return
      }
      nextQuestion()
    })

    quitBtn.addEventListener("click", quitGame)
    restartBtn.addEventListener("click", startNewGame)

    async function loadCountries() {
      statusEl.textContent = "Score:"

      const [unRes, geoRes] = await Promise.all([
        fetch(UN_MEMBERS_URL),
        fetch("countries.geojson")
      ])

      if (!unRes.ok) throw new Error("Could not load UN members list")
      if (!geoRes.ok) throw new Error("Could not load countries.geojson")

      const unRaw = await unRes.json()
      const gj = await geoRes.json()

      const unArr = Array.isArray(unRaw) ? unRaw : []

      const unByA2 = new Map()
      const unByA3 = new Map()
      const unByCanonName = new Map()

      for (const x of unArr) {
        if (!x || x.unMember !== true) continue

        const cca2 = String(x.cca2 || "").toUpperCase()
        const cca3 = String(x.cca3 || "").toUpperCase()
        const common = x.name && x.name.common ? String(x.name.common) : ""
        const official = x.name && x.name.official ? String(x.name.official) : ""

        const key = cca3 || cca2 || canon(common) || canon(official)
        const entry = { key, cca2, cca3, common, official }

        if (cca2) unByA2.set(cca2, entry)
        if (cca3) unByA3.set(cca3, entry)

        if (common) unByCanonName.set(canon(common), entry)
        if (official) unByCanonName.set(canon(official), entry)
      }

      const feats = (gj && gj.features) ? gj.features : []

      const matched = []
      for (const f of feats) {
        const props = f.properties || {}
        const name = geoName(props)
        if (!name) continue

        const iso2u = String(getISO2(props) || "").toUpperCase()
        const iso3u = String(getISO3(props) || "").toUpperCase()

        let entry = null

        if (iso3u && unByA3.has(iso3u)) entry = unByA3.get(iso3u)
        else if (iso2u && unByA2.has(iso2u)) entry = unByA2.get(iso2u)
        else {
          const cn = canon(name)
          if (unByCanonName.has(cn)) entry = unByCanonName.get(cn)
        }

        if (!entry) continue

        const displayName = entry.common || entry.official || name

        matched.push({
          key: entry.key,
          displayName,
          feature: f
        })
      }

      const seen = new Set()
      countries = matched.filter(x => {
        if (!x.key) return false
        if (seen.has(x.key)) return false
        seen.add(x.key)
        return true
      })

      if (countries.length < 150) {
        throw new Error("UN filter left too few countries")
      }
    }

    loadCountries()
      .then(() => {
        updateScoreDisplay(false)
        startNewGame()
      })
      .catch(err => {
        if (messageEl) messageEl.textContent = "Error: " + err.message
        else statusEl.textContent = "Error: " + err.message
      })
  </script>
</body>
</html>
